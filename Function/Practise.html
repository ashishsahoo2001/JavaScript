  <script>
       function check(num)
    {
      if(num%2==0)
      {
        return (`${num} is even`);
      }else{
        return (`${num} is odd`);
      }
    }
    console.log(check(5));
    console.log(check(4));
    console.log(check(0)); 
console.log(check(5));
function between(num1 ,num2){
  if(num1>num2)
  {
    return (`${num1} is large`);
  }else
  return (`${num2} is larger`);
}
console.log(between(10 ,20));
console.log(between(30 ,20));

  </script>
